<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Phillies Player Facts</title>

<style>

:root {
    --navy: #002d72;
    --navy-dark: #001f4d;
    --red: #e81828;
    --red-dark: #c8102e;
    --white: #ffffff;
    --gray-50: #f7f8fa;
    --gray-100: #eef1f5;
    --gray-200: #dfe4ea;
    --gray-400: #9aa5b1;
    --gray-500: #697586;
    --gray-700: #344054;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--gray-50);
    color: var(--navy-dark);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background:
        linear-gradient(
            135deg,
            var(--navy-dark),
            var(--navy)
        );
    color: white;
    box-shadow:
        0 4px 18px
        rgba(0,0,0,.16);
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: white;
    font-size: 23px;
    font-weight: 900;
    border: 2px solid rgba(255,255,255,.8);
}

.brand-name {
    font-size: 19px;
    font-weight: 900;
}

.brand-sub {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.4px;
    opacity: .65;
}

.header-season {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: .75;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 60px;
}

.page-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
}

.kicker {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--red);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.kicker-line {
    width: 28px;
    height: 3px;
    background: var(--red);
}

h1 {
    margin: 7px 0 0;
    font-size: clamp(30px, 5vw, 44px);
    letter-spacing: -1.5px;
}

.description {
    margin: 8px 0 0;
    color: var(--gray-500);
    font-size: 13px;
}

.data-status {
    padding: 9px 13px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    color: var(--gray-500);
    font-size: 9px;
    font-weight: 800;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.control {
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
    padding: 10px 12px;
}

.control label {
    display: block;
    margin-bottom: 5px;
    color: var(--gray-500);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .8px;
    text-transform: uppercase;
}

select {
    min-width: 150px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--navy-dark);
    font-size: 12px;
    font-weight: 800;
}

.players {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.player-row {
    position: relative;
    display: grid;
    grid-template-columns:
        50px
        60px
        minmax(160px, 1fr)
        75px
        90px;
    align-items: center;
    min-height: 72px;
    padding: 10px 15px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    cursor: pointer;
    transition: .18s ease;
}

.player-row:hover {
    transform: translateY(-1px);
    border-color: rgba(232,24,40,.35);
    box-shadow:
        0 8px 25px
        rgba(0,45,114,.10);
}

.player-row.active {
    border-left: 4px solid var(--red);
}

.player-number {
    color: var(--gray-400);
    font-size: 13px;
    font-weight: 900;
}

.player-position {
    color: var(--red);
    font-size: 10px;
    font-weight: 900;
}

.player-name {
    font-size: 15px;
    font-weight: 900;
}

.player-name small {
    display: block;
    margin-top: 3px;
    color: var(--gray-500);
    font-size: 9px;
    font-weight: 700;
}

.player-bt {
    color: var(--gray-700);
    font-size: 10px;
    font-weight: 850;
}

.player-status {
    justify-self: end;
    padding: 5px 8px;
    border-radius: 999px;
    background: var(--gray-100);
    color: var(--gray-500);
    font-size: 8px;
    font-weight: 900;
}

.player-row.active .player-status {
    background: rgba(232,24,40,.09);
    color: var(--red);
}

/* =====================================================
   DETAIL CARD
===================================================== */

.fact-card {
    width: 100%;
    margin: -1px 0 8px;
    padding: 20px;
    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8fafc
        );
    border: 1px solid var(--gray-200);
    border-left: 5px solid var(--red);
    border-radius: 12px;
    box-shadow:
        0 10px 30px
        rgba(0,31,77,.10);
    animation:
        factOpen
        .2s ease;
}

@keyframes factOpen {

    from {
        opacity: 0;
        transform: translateY(-6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.fact-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 17px;
}

.fact-type {
    color: var(--red);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.fact-name {
    margin-top: 4px;
    font-size: 21px;
    font-weight: 900;
}

.fact-meta {
    margin-top: 5px;
    color: var(--gray-500);
    font-size: 10px;
    font-weight: 750;
}

.fact-close {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: var(--gray-100);
    color: var(--gray-500);
    font-size: 18px;
    cursor: pointer;
}

.fact-close:hover {
    background: rgba(232,24,40,.1);
    color: var(--red);
}

.fact-grid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(95px, 1fr)
        );
    gap: 8px;
}

.fact-stat {
    padding: 11px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 9px;
}

.fact-stat-label {
    color: var(--gray-500);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .7px;
}

.fact-stat-value {
    margin-top: 4px;
    color: var(--navy-dark);
    font-size: 17px;
    font-weight: 900;
}

.fact-source {
    margin-top: 13px;
    color: var(--gray-400);
    font-size: 8px;
    font-weight: 700;
    text-align: right;
}

.fact-error {
    padding: 14px;
    background: rgba(232,24,40,.06);
    border: 1px solid rgba(232,24,40,.15);
    border-radius: 9px;
    color: var(--red-dark);
    font-size: 11px;
    font-weight: 700;
}

.message {
    padding: 30px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    text-align: center;
    color: var(--gray-500);
    font-size: 12px;
    font-weight: 700;
}

@media (max-width: 700px) {

    .page-heading {
        align-items: flex-start;
        flex-direction: column;
    }

    .player-row {
        grid-template-columns:
            40px
            45px
            1fr
            65px;
        padding: 10px;
    }

    .player-bt {
        display: none;
    }

    .player-status {
        justify-self: end;
    }

    .fact-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .fact-stat {
        padding: 8px;
    }

    .fact-stat-value {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="brand-mark">
                P
            </div>

            <div>

                <div class="brand-name">
                    Phillies
                </div>

                <div class="brand-sub">
                    PLAYER FACTS
                </div>

            </div>

        </div>

        <div class="header-season">
            MLB 2026
        </div>

    </div>

</header>


<main class="container">


    <section class="page-heading">

        <div>

            <div class="kicker">

                <span class="kicker-line"></span>

                PHILADELPHIA PHILLIES

            </div>

            <h1>
                Player Facts
            </h1>

            <p class="description">
                Tap a player to view detailed statistics.
            </p>

        </div>


        <div
            id="data-status"
            class="data-status"
        >
            Loading...
        </div>

    </section>


    <section class="toolbar">

        <div class="control">

            <label for="position-filter">
                Position
            </label>

            <select
                id="position-filter"
            >

                <option value="all">
                    All
                </option>

                <option value="P">
                    Pitchers
                </option>

                <option value="C">
                    Catchers
                </option>

                <option value="IF">
                    Infielders
                </option>

                <option value="OF">
                    Outfielders
                </option>

            </select>

        </div>


        <div class="control">

            <label for="status-filter">
                Roster
            </label>

            <select
                id="status-filter"
            >

                <option value="all">
                    All Players
                </option>

                <option value="active">
                    Active Only
                </option>

                <option value="nonactive">
                    Non-active
                </option>

            </select>

        </div>

    </section>


    <section
        id="players"
        class="players"
    >

        <div class="message">
            Loading roster...
        </div>

    </section>


</main>


<script>

/* =====================================================
   DATA
===================================================== */

let roster = [];

let statsData = null;

let openedPlayerId = null;

let positionFilter = "all";

let statusFilter = "all";


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON(url) {

    const response =
        await fetch(
            url + "?t=" + Date.now()
        );

    if (!response.ok) {

        throw new Error(
            url +
            " HTTP " +
            response.status
        );

    }

    return await response.json();

}


/* =====================================================
   NORMALIZE PLAYERS
===================================================== */

function normalizePlayers(data) {

    if (
        Array.isArray(data)
    ) {

        return data;

    }

    if (
        data &&
        Array.isArray(data.players)
    ) {

        return data.players;

    }

    return [];

}


/* =====================================================
   PLAYER ID
===================================================== */

function getPlayerId(player) {

    return Number(
        player.id ??
        player.player_id ??
        player.playerId ??
        player.mlb_id ??
        0
    );

}


/* =====================================================
   NAME
===================================================== */

function getPlayerName(player) {

    return (
        player.fullName ??
        player.full_name ??
        player.name ??
        player._name ??
        "Unknown Player"
    );

}


/* =====================================================
   NUMBER
===================================================== */

function getNumber(player) {

    return (
        player.number ??
        player.jerseyNumber ??
        player.jersey_number ??
        player._number ??
        "—"
    );

}


/* =====================================================
   EXACT POSITION
===================================================== */

function getExactPosition(player) {

    const value =
        player.positionCode ??
        player.position ??
        player.pos ??
        player._position ??
        "";

    return String(
        value
    ).toUpperCase() || "—";

}


/* =====================================================
   FILTER POSITION
===================================================== */

function getPositionGroup(player) {

    const pos =
        getExactPosition(
            player
        );

    if (
        pos === "P" ||
        pos === "SP" ||
        pos === "RP"
    ) {

        return "P";

    }

    if (
        pos === "C"
    ) {

        return "C";

    }

    if (
        [
            "1B",
            "2B",
            "3B",
            "SS",
            "IF"
        ].includes(pos)
    ) {

        return "IF";

    }

    if (
        [
            "LF",
            "CF",
            "RF",
            "OF"
        ].includes(pos)
    ) {

        return "OF";

    }

    return "all";

}


/* =====================================================
   ACTIVE
===================================================== */

function isActive(player) {

    if (
        player.active === true
    ) {

        return true;

    }

    if (
        player.active === false
    ) {

        return false;

    }

    const status =
        String(
            player.status ??
            player.rosterStatus ??
            player.roster_status ??
            player._status ??
            ""
        )
        .toLowerCase();

    return (
        status === "active" ||
        status === "active roster"
    );

}


/* =====================================================
   B/T
===================================================== */

function getBats(player) {

    return (
        player.bats ??
        player.battingHand ??
        player.batting_hand ??
        player._bats ??
        "—"
    );

}


function getThrows(player) {

    return (
        player.throws ??
        player.throwingHand ??
        player.throwing_hand ??
        player._throws ??
        "—"
    );

}


/* =====================================================
   FIND SAVANT PLAYER
===================================================== */

function findStats(player) {

    if (!statsData) {

        return null;

    }

    const playerId =
        getPlayerId(
            player
        );

    if (
        !playerId
    ) {

        return null;

    }


    const groups = [

        statsData.batters,

        statsData.pitchers

    ];


    for (
        const group of groups
    ) {

        if (
            !Array.isArray(group)
        ) {

            continue;

        }


        const found =
            group.find(
                item =>
                    Number(
                        item.player_id ??
                        item.id ??
                        item.playerId
                    ) === playerId
            );


        if (found) {

            return found;

        }

    }


    return null;

}


/* =====================================================
   GET STAT
===================================================== */

function stat(
    stats,
    keys
) {

    for (
        const key of keys
    ) {

        if (
            stats &&
            stats[key] !== undefined &&
            stats[key] !== null &&
            stats[key] !== ""
        ) {

            return stats[key];

        }

    }

    return "—";

}


/* =====================================================
   STAT BOX
===================================================== */

function statBox(
    label,
    value
) {

    return `

        <div class="fact-stat">

            <div class="fact-stat-label">

                ${escapeHtml(label)}

            </div>

            <div class="fact-stat-value">

                ${escapeHtml(value)}

            </div>

        </div>

    `;

}


/* =====================================================
   CREATE FACT CARD
===================================================== */

function createFactCard(player) {

    const result =
        findStats(
            player
        );


    const stats =
        result?.stats ??
        result ??
        {};


    const position =
        getExactPosition(
            player
        );


    const pitcher =
        getPositionGroup(
            player
        ) === "P";


    let html = "";


    if (pitcher) {

        html = [

            statBox(
                "ERA",
                stat(
                    stats,
                    ["ERA", "era"]
                )
            ),

            statBox(
                "WHIP",
                stat(
                    stats,
                    ["WHIP", "whip"]
                )
            ),

            statBox(
                "IP",
                stat(
                    stats,
                    ["IP", "ip"]
                )
            ),

            statBox(
                "G",
                stat(
                    stats,
                    ["G", "g"]
                )
            ),

            statBox(
                "GS",
                stat(
                    stats,
                    ["GS", "gs"]
                )
            ),

            statBox(
                "W",
                stat(
                    stats,
                    ["W", "w"]
                )
            ),

            statBox(
                "L",
                stat(
                    stats,
                    ["L", "l"]
                )
            ),

            statBox(
                "SV",
                stat(
                    stats,
                    ["SV", "sv"]
                )
            ),

            statBox(
                "SO",
                stat(
                    stats,
                    ["SO", "so", "strikeouts"]
                )
            ),

            statBox(
                "BB",
                stat(
                    stats,
                    ["BB", "bb", "walks"]
                )
            ),

            statBox(
                "HR",
                stat(
                    stats,
                    ["HR", "hr"]
                )
            ),

            statBox(
                "K/9",
                stat(
                    stats,
                    ["K9", "k9", "K/9"]
                )
            ),

            statBox(
                "BB/9",
                stat(
                    stats,
                    ["BB9", "bb9", "BB/9"]
                )
            )

        ].join("");

    }

    else {

        html = [

            statBox(
                "AVG",
                stat(
                    stats,
                    ["AVG", "avg"]
                )
            ),

            statBox(
                "OBP",
                stat(
                    stats,
                    ["OBP", "obp"]
                )
            ),

            statBox(
                "SLG",
                stat(
                    stats,
                    ["SLG", "slg"]
                )
            ),

            statBox(
                "OPS",
                stat(
                    stats,
                    ["OPS", "ops"]
                )
            ),

            statBox(
                "HR",
                stat(
                    stats,
                    ["HR", "hr"]
                )
            ),

            statBox(
                "RBI",
                stat(
                    stats,
                    ["RBI", "rbi"]
                )
            ),

            statBox(
                "H",
                stat(
                    stats,
                    ["H", "h", "hits"]
                )
            ),

            statBox(
                "2B",
                stat(
                    stats,
                    ["2B", "2b"]
                )
            ),

            statBox(
                "3B",
                stat(
                    stats,
                    ["3B", "3b"]
                )
            ),

            statBox(
                "BB",
                stat(
                    stats,
                    ["BB", "bb", "walks"]
                )
            ),

            statBox(
                "SO",
                stat(
                    stats,
                    ["SO", "so", "strikeouts"]
                )
            ),

            statBox(
                "SB",
                stat(
                    stats,
                    ["SB", "sb"]
                )
            )

        ].join("");

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "fact-card";


    card.innerHTML = `

        <div class="fact-header">

            <div>

                <div class="fact-type">

                    ${
                        pitcher
                            ? "PITCHING"
                            : "BATTING"
                    }

                </div>

                <div class="fact-name">

                    ${escapeHtml(
                        getPlayerName(
                            player
                        )
                    )}

                </div>

                <div class="fact-meta">

                    #${escapeHtml(
                        getNumber(
                            player
                        )
                    )}

                    &nbsp; · &nbsp;

                    ${escapeHtml(
                        position
                    )}

                    &nbsp; · &nbsp;

                    ${escapeHtml(
                        getBats(
                            player
                        )
                    )}

                    /

                    ${escapeHtml(
                        getThrows(
                            player
                        )
                    )}

                </div>

            </div>


            <button
                type="button"
                class="fact-close"
            >
                ×
            </button>

        </div>


        ${
            result

                ? `

                    <div class="fact-grid">

                        ${html}

                    </div>

                  `

                : `

                    <div class="fact-error">

                        Statistics for this player
                        were not found in savant.json.

                        <br><br>

                        MLB ID:
                        ${escapeHtml(
                            getPlayerId(
                                player
                            )
                        )}

                    </div>

                  `
        }


        <div class="fact-source">

            Data:
            savant.json

        </div>

    `;


    card
        .querySelector(
            ".fact-close"
        )
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                card.remove();

                openedPlayerId =
                    null;

            }
        );


    return card;

}


/* =====================================================
   TOGGLE
===================================================== */

function togglePlayer(
    player,
    row
) {

    const id =
        getPlayerId(
            player
        );


    console.log(
        "PLAYER CLICK:",
        getPlayerName(player),
        id
    );


    const oldCard =
        document.querySelector(
            ".fact-card"
        );


    if (
        openedPlayerId === id
    ) {

        if (oldCard) {

            oldCard.remove();

        }

        openedPlayerId =
            null;

        return;

    }


    if (oldCard) {

        oldCard.remove();

    }


    const card =
        createFactCard(
            player
        );


    row.insertAdjacentElement(
        "afterend",
        card
    );


    openedPlayerId =
        id;

}


/* =====================================================
   RENDER
===================================================== */

function renderPlayers() {

    const container =
        document.getElementById(
            "players"
        );


    container.innerHTML =
        "";


    let players =
        roster.filter(
            player => {

                if (
                    positionFilter !==
                    "all"
                ) {

                    if (
                        getPositionGroup(
                            player
                        ) !==
                        positionFilter
                    ) {

                        return false;

                    }

                }


                if (
                    statusFilter ===
                    "active"
                ) {

                    if (
                        !isActive(
                            player
                        )
                    ) {

                        return false;

                    }

                }


                if (
                    statusFilter ===
                    "nonactive"
                ) {

                    if (
                        isActive(
                            player
                        )
                    ) {

                        return false;

                    }

                }


                return true;

            }
        );


    players =
        [...players].sort(
            (a,b) => {

                const na =
                    Number(
                        getNumber(a)
                    );

                const nb =
                    Number(
                        getNumber(b)
                    );


                if (
                    Number.isFinite(na) &&
                    Number.isFinite(nb)
                ) {

                    return na - nb;

                }


                return getPlayerName(a)
                    .localeCompare(
                        getPlayerName(b)
                    );

            }
        );


    if (
        players.length === 0
    ) {

        container.innerHTML = `

            <div class="message">

                No players found.

            </div>

        `;

        return;

    }


    for (
        const player of players
    ) {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "player-row";


        if (
            isActive(
                player
            )
        ) {

            row.classList.add(
                "active"
            );

        }


        row.innerHTML = `

            <div class="player-number">

                #${escapeHtml(
                    getNumber(
                        player
                    )
                )}

            </div>


            <div class="player-position">

                ${escapeHtml(
                    getExactPosition(
                        player
                    )
                )}

            </div>


            <div class="player-name">

                ${escapeHtml(
                    getPlayerName(
                        player
                    )
                )}

                <small>

                    ${escapeHtml(
                        getPositionGroup(
                            player
                        )
                    )}

                </small>

            </div>


            <div class="player-bt">

                ${escapeHtml(
                    getBats(
                        player
                    )
                )}

                /

                ${escapeHtml(
                    getThrows(
                        player
                    )
                )}

            </div>


            <div class="player-status">

                ${
                    isActive(player)
                        ? "ACTIVE"
                        : "NON-ACTIVE"
                }

            </div>

        `;


        /*
         * 重要:
         * clickイベントをここで直接登録
         */

        row.onclick =
            function() {

                togglePlayer(
                    player,
                    row
                );

            };


        container.appendChild(
            row
        );

    }

}


/* =====================================================
   FILTER EVENTS
===================================================== */

document
    .getElementById(
        "position-filter"
    )
    .addEventListener(
        "change",
        function() {

            positionFilter =
                this.value;

            openedPlayerId =
                null;

            renderPlayers();

        }
    );


document
    .getElementById(
        "status-filter"
    )
    .addEventListener(
        "change",
        function() {

            statusFilter =
                this.value;

            openedPlayerId =
                null;

            renderPlayers();

        }
    );


/* =====================================================
   INITIAL LOAD
===================================================== */

async function start() {

    const status =
        document.getElementById(
            "data-status"
        );


    try {

        status.textContent =
            "Loading roster...";


        const playersData =
            await loadJSON(
                "players.json"
            );


        roster =
            normalizePlayers(
                playersData
            );


        status.textContent =
            "Loading statistics...";


        try {

            statsData =
                await loadJSON(
                    "savant.json"
                );

        }

        catch (statsError) {

            console.error(
                "savant.json error:",
                statsError
            );

            statsData =
                null;

        }


        status.textContent =
            `${roster.length} players`;


        renderPlayers();


    }

    catch (error) {

        console.error(
            "fact.html error:",
            error
        );


        status.textContent =
            "ERROR";


        document
            .getElementById(
                "players"
            )
            .innerHTML = `

                <div class="message">

                    Unable to load players.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

    }

}


start();

</script>
