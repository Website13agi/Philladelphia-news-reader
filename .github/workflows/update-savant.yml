name: Update Phillies Savant Stats

on:
  schedule:
    # 6時間ごとに更新
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-savant.yml"

permissions:
  contents: write

jobs:
  update-savant:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =====================================================
      # CHECK ROSTER
      # =====================================================

      - name: Check roster file
        run: |

          if [ ! -f players.json ]; then
            echo "ERROR: players.json was not found."
            exit 1
          fi

          echo "players.json found."


      # =====================================================
      # UPDATE SAVANT
      # =====================================================

      - name: Update Baseball Savant statistics
        run: |

          python scripts/update_stats.py


      # =====================================================
      # CHECK OUTPUT
      # =====================================================

      - name: Check Savant output
        run: |

          if [ ! -f player_stats.json ]; then
            echo "ERROR: player_stats.json was not created."
            exit 1
          fi

          echo "player_stats.json found."


      # =====================================================
      # BASIC VALIDATION
      # =====================================================

      - name: Validate JSON
        run: |

          python - <<'PY'

          import json

          with open(
              "player_stats.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if "players" not in data:
              raise SystemExit(
                  "ERROR: players field is missing."
              )

          print(
              "Savant players:",
              len(data["players"])
          )

          print(
              "Source:",
              data.get("source")
          )

          print(
              "Season:",
              data.get("season")
          )

          PY


      # =====================================================
      # CHECK CHANGES
      # =====================================================

      - name: Check changes
        id: changes
        run: |

          if git diff --quiet -- player_stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit statistics update
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add player_stats.json

          git commit \
            -m "Update Phillies Baseball Savant statistics"

          git push
