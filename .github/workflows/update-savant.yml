name: Update Phillies FanGraphs Stats

on:

  schedule:

    # Every 6 hours
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:

    paths:

      - "scripts/update_fangraphs.py"

      - ".github/workflows/update-fangraphs.yml"


permissions:

  contents: write


jobs:

  update-fangraphs:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"


      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install pybaseball pandas


      # =====================================================
      # CHECK ROSTER
      # =====================================================

      - name: Check roster file

        run: |

          if [ ! -f players.json ]; then

            echo "players.json was not found."

            exit 1

          fi


      # =====================================================
      # UPDATE
      # =====================================================

      - name: Update FanGraphs statistics

        run: |

          python scripts/update_fangraphs.py


      # =====================================================
      # CHECK OUTPUT
      # =====================================================

      - name: Check output

        run: |

          if [ ! -f fangraphs_stats.json ]; then

            echo "fangraphs_stats.json was not created."

            exit 1

          fi


      # =====================================================
      # CHECK CHANGES
      # =====================================================

      - name: Check changes

        id: changes

        run: |

          if git diff --quiet -- fangraphs_stats.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit statistics update

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add fangraphs_stats.json

          git commit \
            -m "Update Phillies FanGraphs statistics"

          git push
