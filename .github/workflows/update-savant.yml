name: Update Phillies Savant Stats

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/update_savant.py"
      - ".github/workflows/update-savant.yml"

permissions:
  contents: write

jobs:
  update-savant:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files
        run: |
          test -f players.json
          test -f scripts/update_savant.py

          echo "players.json OK"
          echo "update_savant.py OK"

      - name: Update Baseball Savant
        run: |
          python scripts/update_savant.py

      - name: Check savant.json
        run: |
          test -f savant.json

          python - <<'PY'
          import json

          with open(
              "savant.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("Source:", data.get("source"))
          print("Season:", data.get("season"))
          print("Batters:", len(data.get("batters", [])))
          print("Pitchers:", len(data.get("pitchers", [])))

          if data.get("source") != "Baseball Savant":
              raise SystemExit(
                  "ERROR: source is not Baseball Savant"
              )

          if "batters" not in data:
              raise SystemExit(
                  "ERROR: batters is missing"
              )

          if "pitchers" not in data:
              raise SystemExit(
                  "ERROR: pitchers is missing"
              )
          PY

      - name: Commit savant.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add savant.json

          if git diff --cached --quiet; then
            echo "No changes to savant.json."
          else
            git commit -m "Update Baseball Savant statistics"
            git push
          fi
