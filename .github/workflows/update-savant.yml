name: Update Phillies Savant Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-savant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Savant
        run: python scripts/update_savant.py

      - name: Check savant.json
        run: |
          python -c "import json; d=json.load(open('savant.json', encoding='utf-8')); print('Batters:', len(d.get('batters', []))); print('Pitchers:', len(d.get('pitchers', [])))"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add savant.json
          git diff --cached --quiet || git commit -m "Update Baseball Savant statistics"
          git push
