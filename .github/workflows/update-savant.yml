name: Update Phillies Savant Stats

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/update_savant.py"
      - ".github/workflows/update-savant.yml"

permissions:
  contents: write

jobs:
  update-savant:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files
        run: |
          test -f roster.json
          test -f scripts/update_savant.py

          echo "roster.json OK"
          echo "update_savant.py OK"

      - name: Update Baseball Savant
        run: |
          python scripts/update_savant.py

      - name: Validate savant.json
        run: |
          test -f savant.json

          python - <<'PY'
          import json

          with open(
              "savant.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("source") != "Baseball Savant":
              raise SystemExit(
                  "ERROR: Invalid source"
              )

          if "batters" not in data:
              raise SystemExit(
                  "ERROR: batters missing"
              )

          if "pitchers" not in data:
              raise SystemExit(
                  "ERROR: pitchers missing"
              )

          print(
              "Season:",
              data.get("season")
          )

          print(
              "Batters:",
              len(data["batters"])
          )

          print(
              "Pitchers:",
              len(data["pitchers"])
          )

          print(
              "Updated:",
              data.get("updatedAt")
          )
          PY

      - name: Check changes
        id: changes
        run: |
          git add savant.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Baseball Savant statistics"
          git push
