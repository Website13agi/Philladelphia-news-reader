name: Update Phillies Stats

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/update_savant.py"
      - ".github/workflows/update-savant.yml"
      - "players.json"

permissions:
  contents: write

jobs:
  update-stats:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check files
        run: |

          echo "Checking required files..."

          test -f players.json

          test -f scripts/update_savant.py

          echo "Required files OK."

      - name: Update MLB official statistics
        run: |

          python scripts/update_savant.py

      - name: Validate savant.json
        run: |

          python - <<'PY'

          import json
          import sys

          path = "savant.json"

          try:

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

          except Exception as e:

              print("Invalid savant.json")
              print(e)

              sys.exit(1)

          required = [
              "team",
              "teamAbbreviation",
              "teamId",
              "season",
              "gameType",
              "source",
              "updatedAt",
              "batters",
              "pitchers"
          ]

          for key in required:

              if key not in data:

                  print(
                      "Missing:",
                      key
                  )

                  sys.exit(1)

          if data["teamId"] != 143:

              print(
                  "Wrong team ID:",
                  data["teamId"]
              )

              sys.exit(1)

          if data["teamAbbreviation"] != "PHI":

              print(
                  "Wrong team abbreviation:",
                  data["teamAbbreviation"]
              )

              sys.exit(1)

          if data["source"] != "MLB Official Stats API":

              print(
                  "Wrong source:",
                  data["source"]
              )

              sys.exit(1)

          if not isinstance(
              data["batters"],
              list
          ):

              print(
                  "batters is not a list"
              )

              sys.exit(1)

          if not isinstance(
              data["pitchers"],
              list
          ):

              print(
                  "pitchers is not a list"
              )

              sys.exit(1)

          total = (
              len(data["batters"])
              +
              len(data["pitchers"])
          )

          if total == 0:

              print(
                  "No player statistics found."
              )

              sys.exit(1)

          for player in (
              data["batters"]
              +
              data["pitchers"]
          ):

              if "player_id" not in player:

                  print(
                      "Player ID missing."
                  )

                  sys.exit(1)

              if "stats" not in player:

                  print(
                      "Player stats missing."
                  )

                  sys.exit(1)

          print("")
          print("================================")
          print("VALIDATION SUCCESS")
          print("================================")

          print(
              "Batters:",
              len(data["batters"])
          )

          print(
              "Pitchers:",
              len(data["pitchers"])
          )

          print(
              "Total:",
              total
          )

          print(
              "Updated:",
              data["updatedAt"]
          )

          print("================================")

          PY

      - name: Check changes
        id: changes
        run: |

          if git diff --quiet -- savant.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No changes."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "savant.json changed."

          fi

      - name: Commit savant.json
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add savant.json

          git commit \
            -m "Update Phillies MLB statistics"

          git push
