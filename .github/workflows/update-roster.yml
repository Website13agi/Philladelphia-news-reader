name: Update Phillies Roster

on:

  # -------------------------------------------------------
  # Every hour
  # -------------------------------------------------------

  schedule:
    - cron: "0 * * * *"

  # -------------------------------------------------------
  # Manual execution
  # -------------------------------------------------------

  workflow_dispatch:

  # -------------------------------------------------------
  # Automatically run when this script changes
  # -------------------------------------------------------

  push:
    paths:
      - "scripts/update_roster.py"
      - ".github/workflows/update-roster.yml"


# ---------------------------------------------------------
# Permission
# ---------------------------------------------------------

permissions:
  contents: write


jobs:

  update-roster:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ---------------------------------------------------
      # Python
      # ---------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ---------------------------------------------------
      # Update roster
      # ---------------------------------------------------

      - name: Update Phillies roster

        run: |

          python scripts/update_roster.py


      # ---------------------------------------------------
      # Check whether players.json changed
      # ---------------------------------------------------

      - name: Check for changes

        id: changes

        run: |

          if git diff --quiet -- players.json; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          fi


      # ---------------------------------------------------
      # Commit
      # ---------------------------------------------------

      - name: Commit roster update

        if:
          steps.changes.outputs.changed == 'true'

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add players.json

          git commit \
            -m "Update Phillies roster"

          git push
