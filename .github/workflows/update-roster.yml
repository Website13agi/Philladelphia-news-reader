name: Update Phillies Roster

on:

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/update_roster.py"
      - ".github/workflows/update-roster.yml"


permissions:
  contents: write


jobs:

  update-roster:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Update roster
        run: |
          python scripts/update_roster.py


      - name: Check roster changes
        id: changes
        run: |
          if git diff --quiet -- players.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Commit roster update
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add players.json

          git commit \
            -m "Update Phillies roster"

          git push
