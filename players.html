<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Phillies Daily — Players</title>


<style>

/* =========================================================
   PHILLIES DAILY
   PLAYERS UI
========================================================= */

:root {

    --red: #e31837;
    --red-dark: #c8102e;
    --red-soft: #fff0f2;

    --navy: #002d62;
    --navy-dark: #001b3d;
    --navy-deep: #00152f;

    --gold: #f5c542;
    --gold-soft: #fff8dc;

    --blue-soft: #edf3f9;

    --white: #ffffff;

    --black: #10151d;

    --gray-900: #252b34;
    --gray-700: #4c5663;
    --gray-600: #687381;
    --gray-500: #89939f;
    --gray-400: #adb5bf;
    --gray-300: #d5dbe2;
    --gray-200: #e4e8ed;
    --gray-100: #f2f4f7;

    --background: #f4f6f9;

    --radius: 17px;

    --shadow:
        0 5px 20px rgba(0,29,62,.07);

    --shadow-hover:
        0 14px 34px rgba(0,29,62,.13);
}


* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    background:
        var(--background);

    color:
        var(--black);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

    padding-bottom:
        30px;
}


button,
select {
    font-family: inherit;
}


button {
    -webkit-tap-highlight-color: transparent;
}


a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {

    height: 76px;

    position: sticky;

    top: 0;

    z-index: 1000;

    background:
        linear-gradient(
            105deg,
            var(--navy-deep),
            var(--navy) 68%,
            #073e78
        );

    border-bottom:
        4px solid var(--red);

    box-shadow:
        0 6px 24px rgba(0,24,54,.2);
}


.topbar-inner {

    max-width: 1280px;

    height: 100%;

    margin: 0 auto;

    padding: 0 28px;

    display: flex;

    align-items: center;

    gap: 34px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: max-content;
}


.brand-logo {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: white;

    border: 2px solid rgba(255,255,255,.9);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}


.brand-logo img {

    width: 88%;

    height: 88%;

    object-fit: contain;
}


.logo-fallback {

    color: var(--red);

    font-family: Georgia, serif;

    font-size: 27px;

    font-weight: 900;

    font-style: italic;
}


.brand-copy {

    display: flex;

    flex-direction: column;

    line-height: 1;
}


.brand-name {

    color: white;

    font-size: 20px;

    font-weight: 900;

    letter-spacing: -.7px;
}


.brand-label {

    margin-top: 6px;

    color: rgba(255,255,255,.55);

    font-size: 8px;

    font-weight: 850;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}


/* =========================================================
   NAV
========================================================= */

.desktop-nav {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 3px;
}


.nav-item {

    height: 100%;

    padding: 0 15px;

    border: none;

    background: transparent;

    color: rgba(255,255,255,.58);

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    position: relative;

    transition: .2s ease;
}


.nav-item::after {

    content: "";

    position: absolute;

    left: 14px;

    right: 14px;

    bottom: -4px;

    height: 4px;

    border-radius: 999px 999px 0 0;

    background: var(--red);

    transform: scaleX(0);

    transition: transform .2s ease;
}


.nav-item:hover,
.nav-item.active {

    color: white;
}


.nav-item.active::after {

    transform: scaleX(1);
}


.header-spacer {
    flex: 1;
}


.header-icon {

    width: 39px;

    height: 39px;

    border: 1px solid rgba(255,255,255,.22);

    border-radius: 50%;

    background: rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 15px;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    max-width: 1280px;

    margin: 0 auto;

    padding: 42px 28px 70px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    margin-bottom: 27px;
}


.page-kicker {

    display: flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 9px;

    color: var(--red);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}


.kicker-line {

    width: 29px;

    height: 4px;

    border-radius: 999px;

    background: var(--red);
}


.page-title {

    margin: 0;

    color: var(--navy-dark);

    font-size: 40px;

    line-height: 1;

    letter-spacing: -2px;

    font-weight: 950;
}


.page-description {

    margin: 10px 0 0;

    color: var(--gray-600);

    font-size: 13px;
}


.roster-meta {

    text-align: right;

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 750;

    letter-spacing: .5px;
}


.roster-meta strong {

    display: block;

    color: var(--navy);

    font-size: 19px;

    font-weight: 900;

    margin-bottom: 3px;
}


/* =========================================================
   FILTER AREA
========================================================= */

.filter-panel {

    background: white;

    border: 1px solid var(--gray-200);

    border-top: 4px solid var(--red);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    padding: 19px 20px 20px;

    margin-bottom: 25px;
}


.filter-heading {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}


.filter-title {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--navy);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.4px;

    text-transform: uppercase;
}


.filter-title::before {

    content: "";

    width: 5px;

    height: 16px;

    border-radius: 999px;

    background: var(--red);
}


.filter-summary {

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 700;
}


.filter-row {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 13px;
}


.filter-label {

    display: block;

    margin-bottom: 7px;

    color: var(--gray-600);

    font-size: 9px;

    font-weight: 850;

    letter-spacing: .8px;

    text-transform: uppercase;
}


.select-wrap {

    position: relative;
}


.select-wrap::after {

    content: "⌄";

    position: absolute;

    right: 14px;

    top: 50%;

    transform: translateY(-55%);

    color: var(--navy);

    font-size: 17px;

    font-weight: 900;

    pointer-events: none;
}


.filter-select {

    width: 100%;

    height: 45px;

    appearance: none;

    -webkit-appearance: none;

    padding: 0 40px 0 14px;

    border: 1px solid var(--gray-200);

    border-radius: 11px;

    background: var(--gray-100);

    color: var(--navy-dark);

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    outline: none;

    transition: .2s ease;
}


.filter-select:hover {

    background: white;

    border-color: var(--gray-300);
}


.filter-select:focus {

    background: white;

    border-color: var(--red);

    box-shadow:
        0 0 0 3px rgba(227,24,55,.09);
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-header {

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    margin: 0 2px 13px;
}


.section-title {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--navy);

    font-size: 12px;

    font-weight: 900;

    letter-spacing: .8px;

    text-transform: uppercase;
}


.section-title::before {

    content: "";

    width: 5px;

    height: 17px;

    border-radius: 999px;

    background: var(--red);
}


.section-count {

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 750;
}


/* =========================================================
   PLAYER GRID
========================================================= */

.player-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card {

    position: relative;

    min-height: 154px;

    overflow: hidden;

    background: white;

    border: 1px solid var(--gray-200);

    border-radius: var(--radius);

    padding: 18px 20px 17px 27px;

    box-shadow: var(--shadow);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}


.player-card:hover {

    transform: translateY(-3px);

    border-color: #cbd3dd;

    box-shadow: var(--shadow-hover);
}


/* ACTIVE RED LINE */

.player-card.active-player::before {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: 5px;

    background: var(--red);
}


/* IL */

.player-card.il-player {

    border-color: #ead58a;

    background:
        linear-gradient(
            135deg,
            #fffef8,
            #fffdf2
        );
}


.player-card.il-player::before {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: 5px;

    background: var(--gold);
}


/* =========================================================
   PLAYER NUMBER
========================================================= */

.player-number {

    position: absolute;

    right: 16px;

    top: 10px;

    color: #eef1f4;

    font-size: 51px;

    line-height: 1;

    font-weight: 950;

    letter-spacing: -4px;

    user-select: none;
}


.player-card.active-player
.player-number {

    color: #f4e7e9;
}


/* =========================================================
   CARD TOP
========================================================= */

.player-top {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 13px;
}


.status-badge {

    display: inline-flex;

    align-items: center;

    height: 22px;

    padding: 0 8px;

    border-radius: 999px;

    background: var(--red-soft);

    color: var(--red);

    font-size: 8px;

    font-weight: 900;

    letter-spacing: .7px;

    text-transform: uppercase;
}


.status-badge.il {

    background: var(--gold-soft);

    color: #856600;
}


.status-badge.reserve {

    background: var(--blue-soft);

    color: var(--navy);
}


.position-badge {

    display: inline-flex;

    align-items: center;

    height: 22px;

    padding: 0 8px;

    border-radius: 999px;

    background: var(--gray-100);

    color: var(--gray-600);

    font-size: 8px;

    font-weight: 850;

    letter-spacing: .5px;
}


/* =========================================================
   NAME
========================================================= */

.player-name {

    position: relative;

    z-index: 2;

    margin: 0;

    max-width: calc(100% - 55px);

    color: var(--navy-dark);

    font-size: 21px;

    line-height: 1.12;

    font-weight: 900;

    letter-spacing: -.7px;
}


.player-subtitle {

    position: relative;

    z-index: 2;

    margin-top: 6px;

    color: var(--gray-600);

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 18px;
}


.info-pill {

    display: inline-flex;

    align-items: center;

    gap: 4px;

    padding: 6px 8px;

    border-radius: 7px;

    background: var(--gray-100);

    color: var(--gray-600);

    font-size: 8px;

    font-weight: 800;

    letter-spacing: .35px;
}


.info-pill strong {

    color: var(--navy);

    font-weight: 900;
}


/* =========================================================
   ACTIVE MARK
========================================================= */

.active-mark {

    position: absolute;

    right: 17px;

    bottom: 17px;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: var(--red);

    box-shadow:
        0 0 0 4px rgba(227,24,55,.08);
}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    grid-column: 1 / -1;

    background: white;

    border: 1px solid var(--gray-200);

    border-radius: var(--radius);

    padding: 70px 20px;

    text-align: center;
}


.empty-icon {

    width: 54px;

    height: 54px;

    margin: 0 auto 15px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--red-soft);

    color: var(--red);

    font-size: 23px;
}


.empty-title {

    margin: 0;

    color: var(--navy);

    font-size: 16px;

    font-weight: 900;
}


.empty-text {

    margin: 7px 0 0;

    color: var(--gray-500);

    font-size: 11px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    grid-column: 1 / -1;

    background: white;

    border: 1px solid var(--gray-200);

    border-radius: var(--radius);

    padding: 70px 20px;

    text-align: center;

    color: var(--gray-500);

    font-size: 12px;

    font-weight: 750;
}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-nav {

    display: none;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .topbar-inner {

        gap: 20px;
    }


    .nav-item {

        padding: 0 9px;
    }


    .nav-item::after {

        left: 9px;

        right: 9px;
    }


    .player-grid {

        grid-template-columns:
            1fr;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {

        padding-bottom:
            calc(
                74px +
                env(safe-area-inset-bottom)
            );
    }


    .topbar {

        height: 64px;

        border-bottom-width: 3px;
    }


    .topbar-inner {

        padding: 0 14px;

        gap: 0;
    }


    .brand {

        gap: 10px;
    }


    .brand-logo {

        width: 40px;

        height: 40px;
    }


    .brand-name {

        font-size: 18px;
    }


    .brand-label {

        font-size: 7px;
    }


    .desktop-nav {

        display: none;
    }


    .header-icon {

        width: 36px;

        height: 36px;

        margin-left: auto;
    }


    .page {

        padding:
            25px 13px 35px;
    }


    .page-header {

        align-items: flex-start;

        margin-bottom: 20px;
    }


    .page-title {

        font-size: 31px;

        letter-spacing: -1.5px;
    }


    .page-description {

        max-width: 300px;

        font-size: 11px;

        line-height: 1.5;
    }


    .roster-meta {

        display: none;
    }


    .filter-panel {

        padding: 16px;

        border-top-width: 3px;

        margin-bottom: 20px;
    }


    .filter-heading {

        align-items: flex-start;

        flex-direction: column;

        gap: 5px;
    }


    .filter-row {

        grid-template-columns: 1fr;

        gap: 11px;
    }


    .filter-select {

        height: 46px;
    }


    .player-grid {

        gap: 9px;
    }


    .player-card {

        min-height: 150px;

        padding:
            17px 17px 16px 21px;

        border-radius: 14px;
    }


    .player-name {

        font-size: 19px;

        max-width: calc(100% - 45px);
    }


    .player-number {

        font-size: 46px;

        right: 12px;
    }


    .player-info {

        margin-top: 15px;
    }


    .mobile-nav {

        position: fixed;

        left: 0;

        right: 0;

        bottom: 0;

        height: 74px;

        padding-bottom:
            env(safe-area-inset-bottom);

        display: flex;

        z-index: 2000;

        background:
            rgba(255,255,255,.97);

        border-top:
            1px solid var(--gray-200);

        box-shadow:
            0 -5px 22px rgba(0,29,62,.09);

        backdrop-filter:
            blur(14px);

        -webkit-backdrop-filter:
            blur(14px);
    }


    .mobile-nav-item {

        flex: 1;

        height: 100%;

        border: none;

        background: transparent;

        color: var(--gray-500);

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 4px;

        font-size: 9px;

        font-weight: 800;

        cursor: pointer;

        position: relative;
    }


    .mobile-nav-item::before {

        content: "";

        position: absolute;

        top: 0;

        left: 25%;

        right: 25%;

        height: 3px;

        border-radius:
            0 0 999px 999px;

        background: var(--red);

        transform: scaleX(0);

        transition: .2s ease;
    }


    .mobile-nav-item.active {

        color: var(--navy);
    }


    .mobile-nav-item.active::before {

        transform: scaleX(1);
    }


    .mobile-nav-icon {

        height: 25px;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 18px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 420px) {

    .page {

        padding-left: 10px;

        padding-right: 10px;
    }


    .page-title {

        font-size: 28px;
    }


    .player-card {

        padding-left: 19px;
    }


    .player-name {

        font-size: 18px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="topbar">

    <div class="topbar-inner">


        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-logo">

                <img
                    src="phillies-logo.png"
                    alt="Philadelphia Phillies"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='block';
                    "
                >

                <span
                    class="logo-fallback"
                    style="display:none;"
                >
                    P
                </span>

            </div>


            <div class="brand-copy">

                <div class="brand-name">
                    Phillies
                </div>

                <div class="brand-label">
                    Daily News
                </div>

            </div>

        </a>


        <nav class="desktop-nav">

            <button
                class="nav-item"
                onclick="location.href='index.html'"
            >
                News
            </button>


            <button
                class="nav-item"
                onclick="location.href='games.html'"
            >
                Games
            </button>


            <button
                class="nav-item active"
            >
                Players
            </button>


            <button
                class="nav-item"
                onclick="showMore()"
            >
                More
            </button>

        </nav>


        <div class="header-spacer"></div>


        <button
            class="header-icon"
            title="More"
            onclick="showMore()"
        >
            ⋯
        </button>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="page">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <div>

            <div class="page-kicker">

                <span class="kicker-line"></span>

                Philadelphia Phillies

            </div>


            <h1 class="page-title">
                Players
            </h1>


            <p class="page-description">
                Current Phillies roster, organized by position and status.
            </p>

        </div>


        <div class="roster-meta">

            <strong id="roster-total">
                —
            </strong>

            ROSTER PLAYERS

        </div>

    </section>



    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <section class="filter-panel">


        <div class="filter-heading">

            <div class="filter-title">
                Roster Filters
            </div>


            <div
                class="filter-summary"
                id="filter-summary"
            >
                All players
            </div>

        </div>


        <div class="filter-row">


            <!-- POSITION -->

            <div>

                <label
                    class="filter-label"
                    for="position-filter"
                >
                    Position
                </label>


                <div class="select-wrap">

                    <select
                        id="position-filter"
                        class="filter-select"
                        onchange="renderPlayers()"
                    >

                        <option value="all">
                            All Players
                        </option>

                        <option value="pitcher">
                            Pitchers
                        </option>

                        <option value="catcher">
                            Catchers
                        </option>

                        <option value="infielder">
                            Infielders
                        </option>

                        <option value="outfielder">
                            Outfielders
                        </option>

                    </select>

                </div>

            </div>



            <!-- STATUS -->

            <div>

                <label
                    class="filter-label"
                    for="status-filter"
                >
                    Roster Status
                </label>


                <div class="select-wrap">

                    <select
                        id="status-filter"
                        class="filter-select"
                        onchange="renderPlayers()"
                    >

                        <option value="all">
                            All Roster Players
                        </option>

                        <option value="active">
                            Active Only
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         PLAYERS
    ====================================================== -->

    <section>


        <div class="section-header">

            <div class="section-title">
                Roster
            </div>


            <div
                class="section-count"
                id="player-count"
            >
                —
            </div>

        </div>


        <div
            id="player-grid"
            class="player-grid"
        >

            <div class="loading">
                Loading roster...
            </div>

        </div>

    </section>

</main>

<script>

/* =========================================================
   DATA
========================================================= */

let players = [];


/* =========================================================
   LOAD PLAYERS
========================================================= */

async function loadPlayers() {

    const container =
        document.getElementById(
            "player-grid"
        );


    container.innerHTML = `
        <div class="loading">
            Loading Phillies roster...
        </div>
    `;


    try {

        const response =
            await fetch(
                "players.json?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
           players.json が

           [
             {...},
             {...}
           ]

           の場合

           あるいは

           {
             "players": [...]
           }

           の場合の両方に対応
        */

        if (Array.isArray(data)) {

            players = data;

        } else if (
            data &&
            Array.isArray(data.players)
        ) {

            players = data.players;

        } else if (
            data &&
            Array.isArray(data.roster)
        ) {

            players = data.roster;

        } else {

            players = [];

        }


        normalizePlayers();

        renderPlayers();

    } catch (error) {

        console.error(
            "Roster loading error:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚾
                </div>

                <h2 class="empty-title">
                    Roster unavailable
                </h2>

                <p class="empty-text">
                    players.json could not be loaded.
                </p>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizePlayers() {

    players =
        players
        .map(
            (player, index) => {

                const p =
                    player || {};


                return {

                    id:
                        p.id ??
                        p.player_id ??
                        index,


                    name:
                        p.name ??
                        p.fullName ??
                        p.full_name ??
                        "Unknown Player",


                    firstName:
                        p.firstName ??
                        "",


                    lastName:
                        p.lastName ??
                        "",


                    number:
                        p.number ??
                        p.jerseyNumber ??
                        p.jersey_number ??
                        "",


                    position:
                        p.position ??
                        p.primaryPosition ??
                        p.primary_position ??
                        p.pos ??
                        "",


                    group:
                        p.group ??
                        p.positionGroup ??
                        p.position_group ??
                        "",


                    bats:
                        p.bats ??
                        p.batSide ??
                        p.bat_side ??
                        "",


                    throws:
                        p.throws ??
                        p.throwSide ??
                        p.throw_side ??
                        "",


                    status:
                        p.status ??
                        p.rosterStatus ??
                        p.roster_status ??
                        "",


                    active:
                        p.active ??
                        p.isActive ??
                        p.is_active ??
                        false,


                    il:
                        p.il ??
                        p.injured ??
                        p.injuryList ??
                        p.injury_list ??
                        false,


                    fortyMan:
                        p.fortyMan ??
                        p.forty_man ??
                        p.on40Man ??
                        false

                };

            }
        );

}


/* =========================================================
   POSITION GROUP
========================================================= */

function getPositionGroup(player) {

    const raw =
        String(
            player.group ||
            player.position ||
            ""
        )
        .toLowerCase()
        .trim();


    if (
        raw.includes("pitch")
        ||
        raw === "p"
        ||
        raw.includes("投")
    ) {

        return "pitcher";

    }


    if (
        raw.includes("catch")
        ||
        raw === "c"
        ||
        raw.includes("捕")
    ) {

        return "catcher";

    }


    if (
        raw.includes("outfield")
        ||
        raw === "of"
        ||
        raw === "lf"
        ||
        raw === "cf"
        ||
        raw === "rf"
        ||
        raw.includes("外")
    ) {

        return "outfielder";

    }


    if (
        raw.includes("infield")
        ||
        raw === "1b"
        ||
        raw === "2b"
        ||
        raw === "3b"
        ||
        raw === "ss"
        ||
        raw === "inf"
        ||
        raw.includes("内")
    ) {

        return "infielder";

    }


    return "other";

}


/* =========================================================
   STATUS
========================================================= */

function isActive(player) {

    if (
        player.active === true
        ||
        player.active === 1
        ||
        player.active === "true"
    ) {

        return true;

    }


    const status =
        String(
            player.status || ""
        )
        .toLowerCase();


    return (
        status.includes("active")
        &&
        !status.includes("inactive")
        &&
        !status.includes("il")
    );

}


/* =========================================================
   IL
========================================================= */

function isIL(player) {

    if (
        player.il === true
        ||
        player.il === 1
        ||
        player.il === "true"
    ) {

        return true;

    }


    const status =
        String(
            player.status || ""
        )
        .toLowerCase();


    return (
        status.includes("il")
        ||
        status.includes("injured")
    );

}


/* =========================================================
   POSITION DISPLAY
========================================================= */

function positionDisplay(player) {

    const position =
        String(
            player.position || ""
        ).trim();


    if (position) {

        return position;

    }


    const group =
        getPositionGroup(player);


    if (group === "pitcher") {
        return "P";
    }


    if (group === "catcher") {
        return "C";
    }


    if (group === "infielder") {
        return "INF";
    }


    if (group === "outfielder") {
        return "OF";
    }


    return "—";

}


/* =========================================================
   SORT
========================================================= */

function jerseyNumber(player) {

    const n =
        parseInt(
            String(
                player.number
            ).replace(
                /\D/g,
                ""
            ),
            10
        );


    return Number.isFinite(n)
        ? n
        : 9999;

}


/* =========================================================
   FILTER + RENDER
========================================================= */

function renderPlayers() {

    const container =
        document.getElementById(
            "player-grid"
        );


    const position =
        document.getElementById(
            "position-filter"
        ).value;


    const status =
        document.getElementById(
            "status-filter"
        ).value;


    let filtered =
        [...players];


    /* POSITION */

    if (position !== "all") {

        filtered =
            filtered.filter(
                player =>
                    getPositionGroup(player)
                    === position
            );

    }


    /* ACTIVE */

    if (status === "active") {

        filtered =
            filtered.filter(
                player =>
                    isActive(player)
            );

    }


    /* NUMBER */

    filtered.sort(
        (a, b) =>
            jerseyNumber(a) -
            jerseyNumber(b)
    );


    /* COUNTS */

    document.getElementById(
        "player-count"
    ).textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "player"
                : "players"
        }`;


    document.getElementById(
        "roster-total"
    ).textContent =
        players.length;


    document.getElementById(
        "filter-summary"
    ).textContent =
        buildFilterSummary(
            position,
            status
        );


    container.innerHTML = "";


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚾
                </div>

                <h2 class="empty-title">
                    No players found
                </h2>

                <p class="empty-text">
                    Try changing the roster filters.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(
        player => {

            container.appendChild(
                createPlayerCard(player)
            );

        }
    );

}


/* =========================================================
   FILTER SUMMARY
========================================================= */

function buildFilterSummary(
    position,
    status
) {

    let parts = [];


    if (position === "all") {

        parts.push(
            "All positions"
        );

    } else {

        const labels = {

            pitcher: "Pitchers",

            catcher: "Catchers",

            infielder: "Infielders",

            outfielder: "Outfielders"

        };


        parts.push(
            labels[position] ||
            "Players"
        );

    }


    if (status === "active") {

        parts.push(
            "Active only"
        );

    } else {

        parts.push(
            "Full roster"
        );

    }


    return parts.join(
        " · "
    );

}


/* =========================================================
   CARD
========================================================= */

function createPlayerCard(player) {

    const card =
        document.createElement(
            "article"
        );


    const active =
        isActive(player);


    const il =
        isIL(player);


    card.className =
        "player-card" +
        (
            active
                ? " active-player"
                : ""
        ) +
        (
            il
                ? " il-player"
                : ""
        );


    const group =
        getPositionGroup(player);


    let statusText =
        "40-MAN";


    let statusClass =
        "reserve";


    if (il) {

        statusText =
            "IL";

        statusClass =
            "il";

    } else if (active) {

        statusText =
            "ACTIVE";

        statusClass =
            "";

    }


    const number =
        player.number !== ""
            ? player.number
            : "—";


    const position =
        positionDisplay(player);


    const bats =
        player.bats
            ? String(player.bats)
                .toUpperCase()
            : "—";


    const throws =
        player.throws
            ? String(player.throws)
                .toUpperCase()
            : "—";


    card.innerHTML = `

        <div class="player-number">
            ${escapeHtml(String(number))}
        </div>


        <div class="player-top">

            <span
                class="status-badge ${statusClass}"
            >
                ${statusText}
            </span>


            <span class="position-badge">
                ${escapeHtml(position)}
            </span>

        </div>


        <h2 class="player-name">
            ${escapeHtml(
                String(player.name)
            )}
        </h2>


        <div class="player-subtitle">

            ${
                group === "pitcher"
                    ? "Pitcher"
                    : "Position Player"
            }

            ${
                player.fortyMan
                    ? " · 40-Man Roster"
                    : ""
            }

        </div>


        <div class="player-info">

            <span class="info-pill">

                BATS

                <strong>
                    ${escapeHtml(bats)}
                </strong>

            </span>


            <span class="info-pill">

                THROWS

                <strong>
                    ${escapeHtml(throws)}
                </strong>

            </span>


            ${
                group !== "pitcher"
                    ? `
                        <span class="info-pill">

                            POS

                            <strong>
                                ${escapeHtml(position)}
                            </strong>

                        </span>
                    `
                    : ""
            }

        </div>


        ${
            active
                ? `
                    <span
                        class="active-mark"
                        title="Active roster"
                    ></span>
                `
                : ""
        }

    `;


    return card;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


/* =========================================================
   MORE
========================================================= */

function showMore() {

    alert(
        "MORE の内容は今後追加します。"
    );

}


/* =========================================================
   START
========================================================= */

loadPlayers();

</script>


</body>

</html>
