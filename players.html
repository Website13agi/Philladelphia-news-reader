   PHILLIES DAILY

========================================================= */

        #e31837;

        #fff0f2;

        #001b3d;

        #00152f;

        #10151d;

    --gray-900:
        #252b34;

    --gray-700:
        #4c5663;

    --gray-600:
        #687381;

    --gray-500:
        #89939f;

    --gray-400:
        #adb5bf;

    --gray-300:
        #d5dbe2;

    --gray-200:
        #e4e8ed;

    --gray-100:
        #f2f4f7;

    --background:
        #f4f6f9;

    --il:
        #f2b705;

    --il-dark:
        #9a7300;

    --il-soft:
        #fff7d6;

    --green:
        #218542;

    --green-soft:
        #e9f7ee;

        16px;

        0 4px 18px
        rgba(0,29,62,.065);

        0 14px 34px
        rgba(0,29,62,.13);
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing:

}


html {
    scroll-behavior:
        smooth;
}


body {

    margin:
        0;

    background:
        var(--background);

    color:
        var(--black);

    font-family:
        Inter,

        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

    padding-bottom:
        30px;
}


a {

    color:
        inherit;

    text-decoration:
        none;

}


/* =========================================================
   HEADER
========================================================= */

.topbar {

    height:
        76px;

        linear-gradient(
            105deg,
            var(--navy-deep),
            var(--navy) 62%,
            #003875

    border-bottom:
        4px solid
        var(--red);

    position:
        sticky;

    top:
        0;

    z-index:
        1000;

    box-shadow:
        0 5px 22px

}


.topbar-inner {

    max-width:
        1280px;

    height:
        100%;

    margin:
        auto;

    padding:

    display:
        flex;

    align-items:
        center;

    gap:
        32px;

}


/* =========================================================
   BRAND
========================================================= */

.brand {

        flex;

    gap:

        max-content;
}


.brand-logo {

    width:

    border-radius:
        50%;

        white;

        center;

    overflow:

}

        8px;

    font-weight:
        850;

    letter-spacing:
        1.7px;

    text-transform:
        uppercase;
}


/* =========================================================
   NAV
========================================================= */

.desktop-nav {

    height:
        100%;

    display:
        flex;

    align-items:
        center;

    gap:
        2px;
}


.nav-item {

    height:
        100%;

    padding:
        0 15px;

    display:
        flex;

    align-items:
        center;

    position:
        relative;

    color:

    font-size:

    font-weight:

}

<script>

/* =========================================================
   CONFIG
========================================================= */

const POSITION_ORDER = [

    "Pitchers",

    "Catchers",

    "Infielders",

    "Outfielders"

];


const POSITION_LABELS = {

    Pitchers:
        "Pitchers",

    Catchers:
        "Catchers",

    Infielders:
        "Infielders",

    Outfielders:
        "Outfielders"

};


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   NUMBER SORT
========================================================= */

function numberValue(number) {

    if (
        number === null ||
        number === undefined
    ) {

        return 9999;

    }

    const value =
        String(number).trim();

    if (!value) {

        return 9999;

    }

    const parsed =
        Number(value);

    if (
        Number.isNaN(parsed)
    ) {

        return 9999;

    }

    return parsed;

}


/* =========================================================
   SORT PLAYERS
========================================================= */

function sortPlayers(players) {

    return [...players].sort(
        (a, b) => {

            const numberDifference =
                numberValue(a.number)
                -
                numberValue(b.number);

            if (
                numberDifference !== 0
            ) {

                return numberDifference;

            }

            return String(
                a.name || ""
            ).localeCompare(
                String(
                    b.name || ""
                ),
                "en",
                {
                    sensitivity:
                        "base"
                }
            );

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function statusLabel(status) {

    if (
        status === "ACTIVE"
    ) {

        return "ACTIVE";

    }

    if (
        status === "IL"
    ) {

        return "IL";

    }

    return "40-MAN";

}


function statusClass(status) {

    if (
        status === "ACTIVE"
    ) {

        return "status-active";

    }

    if (
        status === "IL"
    ) {

        return "status-il";

    }

    return "status-40";

}


/* =========================================================
   RENDER
========================================================= */

function renderPlayers(data) {

    const container =
        document.getElementById(
            "players-container"
        );

    container.innerHTML =
        "";

    if (
        !data ||
        !Array.isArray(
            data.players
        )
    ) {

        container.innerHTML = `

            <div class="message">

                Roster data is unavailable.

            </div>

        `;

        return;

    }


    const players =
        data.players;


    /* -----------------------------------------------------
       SUMMARY
    ----------------------------------------------------- */

    const total =
        players.length;


    const active =
        players.filter(
            player =>
                player.status ===
                "ACTIVE"
        ).length;


    const il =
        players.filter(
            player =>
                player.status ===
                "IL"
        ).length;


    document.getElementById(
        "total-count"
    ).textContent =
        total;


    document.getElementById(
        "active-count"
    ).textContent =
        active;


    document.getElementById(
        "il-count"
    ).textContent =
        il;


    /* -----------------------------------------------------
       POSITION SECTIONS
    ----------------------------------------------------- */

    POSITION_ORDER.forEach(
        position => {

            const positionPlayers =
                sortPlayers(

                    players.filter(
                        player =>
                            player.position
                            ===
                            position
                    )

                );


            if (
                positionPlayers.length
                ===
                0
            ) {

                return;

            }


            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "position-section";


            section.innerHTML = `

                <div
                    class="position-heading"
                >

                    <div
                        class="
                            position-heading-left
                        "
                    >

                        <span
                            class="position-mark"
                        ></span>

                        <span
                            class="position-title"
                        >
                            ${POSITION_LABELS[position]}
                        </span>

                    </div>


                    <span
                        class="position-count"
                    >
                        ${positionPlayers.length}
                        players
                    </span>

                </div>


                <div
                    class="player-grid"
                ></div>

            `;


            const grid =
                section.querySelector(
                    ".player-grid"
                );


            positionPlayers.forEach(
                player => {

                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "player-card" +
                        (
                            player.status
                            ===
                            "IL"
                                ? " il"
                                : ""
                        );


                    card.href =
                        player.mlb_url
                        ||
                        "#";


                    card.target =
                        "_blank";


                    card.rel =
                        "noopener noreferrer";


                    const number =
                        player.number
                        ||
                        "—";


                    card.innerHTML = `

                        <div
                            class="player-number"
                        >
                            ${escapeHtml(
                                number
                            )}
                        </div>


                        <div
                            class="player-name"
                        >
                            ${escapeHtml(
                                player.name
                            )}
                        </div>


                        <div
                            class="player-meta"
                        >
                            ${escapeHtml(
                                position
                            )}
                        </div>


                        <div
                            class="
                                player-status
                                ${statusClass(
                                    player.status
                                )}
                            "
                        >
                            ${statusLabel(
                                player.status
                            )}
                        </div>

                    `;


                    grid.appendChild(
                        card
                    );

                }
            );


            container.appendChild(
                section
            );

        }
    );


    /* -----------------------------------------------------
       OTHER
       Unexpected API position data is not silently lost.
       Display it at the bottom if it exists.
    ----------------------------------------------------- */

    const otherPlayers =
        sortPlayers(

            players.filter(
                player =>
                    !POSITION_ORDER.includes(
                        player.position
                    )
            )

        );


    if (
        otherPlayers.length > 0
    ) {

        const section =
            document.createElement(
                "section"
            );


        section.className =
            "position-section";


        section.innerHTML = `

            <div
                class="position-heading"
            >

                <div
                    class="
                        position-heading-left
                    "
                >

                    <span
                        class="position-mark"
                    ></span>

                    <span
                        class="position-title"
                    >
                        Other
                    </span>

                </div>


                <span
                    class="position-count"
                >
                    ${otherPlayers.length}
                    players
                </span>

            </div>


            <div
                class="player-grid"
            ></div>

        `;


        const grid =
            section.querySelector(
                ".player-grid"
            );


        otherPlayers.forEach(
            player => {

                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "player-card" +
                    (
                        player.status
                        ===
                        "IL"
                            ? " il"
                            : ""
                    );


                card.href =
                    player.mlb_url
                    ||
                    "#";


                card.target =
                    "_blank";


                card.rel =
                    "noopener noreferrer";


                card.innerHTML = `

                    <div
                        class="player-number"
                    >
                        ${escapeHtml(
                            player.number ||
                            "—"
                        )}
                    </div>

                    <div
                        class="player-name"
                    >
                        ${escapeHtml(
                            player.name
                        )}
                    </div>

                    <div
                        class="player-meta"
                    >
                        ${escapeHtml(
                            player.position
                        )}
                    </div>

                    <div
                        class="
                            player-status
                            ${statusClass(
                                player.status
                            )}
                        "
                    >
                        ${statusLabel(
                            player.status
                        )}
                    </div>

                `;


                grid.appendChild(
                    card
                );

            }
        );


        container.appendChild(
            section
        );

    }


    /* -----------------------------------------------------
       UPDATED
    ----------------------------------------------------- */

    const updated =
        document.getElementById(
            "roster-updated"
        );


    if (
        data.updated_at
    ) {

        const date =
            new Date(
                data.updated_at
            );


        updated.textContent =
            "Last updated: " +
            date.toLocaleString(
                "en-US",
                {
                    month:
                        "short",

                    day:
                        "numeric",

                    year:
                        "numeric",

                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            );

    }

}


/* =========================================================
   LOAD
========================================================= */

async function loadPlayers() {

    const container =
        document.getElementById(
            "players-container"
        );


    try {

        const response =
            await fetch(

                "players.json?ts="
                +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        renderPlayers(
            data
        );

    }


    catch(error) {

        console.error(
            "Phillies roster error:",
            error
        );


        container.innerHTML = `

            <div class="message">

                <strong>
                    Unable to load the Phillies roster.
                </strong>

                <br><br>

                Please check the latest
                GitHub Actions roster update.

            </div>

        `;

    }

}


/* =========================================================
   START
========================================================= */

loadPlayers();

</script>

</html>
