<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phillies Players</title>

<style>

/* =========================================================
   PHILLIES PLAYERS
========================================================= */

:root {
    --red: #e31837;
    --red-dark: #c8102e;
    --red-soft: #fff0f2;

    --navy: #002d62;
    --navy-dark: #001b3d;
    --navy-deep: #00152f;

    --gold: #f4c542;
    --gold-soft: #fff8d9;

    --white: #fff;

    --black: #10151d;

    --gray-900: #252b34;
    --gray-700: #4c5663;
    --gray-600: #687381;
    --gray-500: #89939f;
    --gray-400: #adb5bf;
    --gray-300: #d5dbe2;
    --gray-200: #e4e8ed;
    --gray-100: #f2f4f7;

    --background: #f4f6f9;

    --radius: 16px;

    --shadow:
        0 5px 22px rgba(0,29,62,.065);

    --shadow-hover:
        0 14px 34px rgba(0,29,62,.13);
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--black);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    padding-bottom: 90px;
}

button,
select {
    font-family: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    height: 76px;

    background:
        linear-gradient(
            110deg,
            var(--navy-deep),
            var(--navy) 62%,
            #063d78
        );

    border-bottom: 4px solid var(--red);

    position: sticky;
    top: 0;
    z-index: 1000;

    box-shadow:
        0 5px 22px rgba(0,24,54,.2);
}

.topbar-inner {
    max-width: 1280px;
    height: 100%;
    margin: 0 auto;

    padding: 0 28px;

    display: flex;
    align-items: center;
    gap: 32px;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    min-width: max-content;
}

.brand-logo {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    box-shadow:
        0 4px 14px rgba(0,0,0,.25);
}

.brand-logo img {
    width: 90%;
    height: 90%;
    object-fit: contain;
}

.logo-fallback {
    color: var(--red);

    font-family: Georgia, serif;

    font-size: 28px;
    font-weight: 900;
    font-style: italic;
}

.brand-copy {
    display: flex;
    flex-direction: column;
}

.brand-name {
    color: white;

    font-size: 20px;
    font-weight: 900;

    letter-spacing: -.7px;
}

.brand-label {
    margin-top: 5px;

    color: rgba(255,255,255,.55);

    font-size: 8px;
    font-weight: 900;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}


/* =========================================================
   DESKTOP NAV
========================================================= */

.desktop-nav {
    height: 100%;

    display: flex;
    align-items: center;

    gap: 3px;
}

.nav-item {
    height: 100%;

    padding: 0 15px;

    border: none;
    background: transparent;

    color: rgba(255,255,255,.56);

    font-size: 13px;
    font-weight: 850;

    cursor: pointer;

    position: relative;

    transition: color .2s ease;
}

.nav-item::after {
    content: "";

    position: absolute;

    left: 14px;
    right: 14px;
    bottom: -4px;

    height: 4px;

    background: var(--red);

    border-radius: 999px 999px 0 0;

    transform: scaleX(0);

    transition: transform .2s ease;
}

.nav-item:hover,
.nav-item.active {
    color: white;
}

.nav-item.active::after {
    transform: scaleX(1);
}

.header-spacer {
    flex: 1;
}

.header-icon {
    width: 39px;
    height: 39px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.22);

    background: rgba(255,255,255,.06);

    color: white;

    cursor: pointer;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    max-width: 1280px;

    margin: 0 auto;

    padding: 40px 28px 70px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {
    display: flex;

    justify-content: space-between;
    align-items: flex-end;

    margin-bottom: 27px;
}

.page-kicker {
    display: flex;
    align-items: center;
    gap: 9px;

    margin-bottom: 9px;

    color: var(--red);

    font-size: 10px;
    font-weight: 900;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}

.kicker-line {
    width: 28px;
    height: 4px;

    border-radius: 999px;

    background: var(--red);
}

.page-title {
    margin: 0;

    color: var(--navy-dark);

    font-size: 40px;
    line-height: 1;

    letter-spacing: -2px;

    font-weight: 950;
}

.page-description {
    margin: 10px 0 0;

    color: var(--gray-600);

    font-size: 13px;
}

.updated-label {
    color: var(--gray-500);

    font-size: 10px;
    font-weight: 800;

    text-align: right;

    text-transform: uppercase;
}


/* =========================================================
   FILTER PANEL
========================================================= */

.filter-panel {
    background: white;

    border:
        1px solid var(--gray-200);

    border-top:
        4px solid var(--navy);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    padding: 20px;

    margin-bottom: 25px;
}

.filter-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 17px;
}

.filter-title {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--navy);

    font-size: 11px;
    font-weight: 950;

    letter-spacing: 1.3px;

    text-transform: uppercase;
}

.filter-title::before {
    content: "";

    width: 5px;
    height: 17px;

    border-radius: 999px;

    background: var(--red);
}

.result-count {
    color: var(--gray-500);

    font-size: 11px;
    font-weight: 750;
}

.filter-grid {
    display: grid;

    grid-template-columns:
        1.2fr
        1.2fr
        .9fr;

    gap: 13px;
}

.filter-field {
    min-width: 0;
}

.filter-label {
    display: block;

    margin-bottom: 7px;

    color: var(--gray-600);

    font-size: 9px;
    font-weight: 900;

    letter-spacing: .8px;

    text-transform: uppercase;
}

.select-wrap {
    position: relative;
}

.select-wrap::after {
    content: "⌄";

    position: absolute;

    right: 14px;
    top: 50%;

    transform: translateY(-55%);

    color: var(--navy);

    font-size: 17px;
    font-weight: 900;

    pointer-events: none;
}

.filter-select {
    width: 100%;
    height: 46px;

    appearance: none;
    -webkit-appearance: none;

    padding: 0 40px 0 14px;

    border:
        1px solid var(--gray-200);

    border-radius: 11px;

    background: var(--gray-100);

    color: var(--navy-dark);

    font-size: 12px;
    font-weight: 850;

    cursor: pointer;

    outline: none;

    transition:
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.filter-select:hover {
    background: white;

    border-color: var(--gray-300);
}

.filter-select:focus {
    background: white;

    border-color: var(--red);

    box-shadow:
        0 0 0 3px rgba(227,24,55,.1);
}


/* =========================================================
   PLAYERS
========================================================= */

.players-section-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin: 0 2px 12px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--navy);

    font-size: 12px;
    font-weight: 950;

    letter-spacing: .8px;

    text-transform: uppercase;
}

.section-title::before {
    content: "";

    width: 5px;
    height: 18px;

    border-radius: 999px;

    background: var(--red);
}


/* =========================================================
   PLAYER GRID
========================================================= */

.player-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 13px;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card {
    position: relative;

    display: grid;

    grid-template-columns:
        66px
        minmax(0,1fr)
        auto;

    align-items: center;

    min-height: 122px;

    padding: 17px 18px 17px 21px;

    background: white;

    border:
        1px solid var(--gray-200);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}


/* ACTIVE / IL LINE */

.player-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;

    background: var(--gray-300);
}

.player-card.active::before {
    background: var(--red);
}

.player-card.il::before {
    background: var(--gold);
}

.player-card:hover {
    transform: translateY(-2px);

    box-shadow: var(--shadow-hover);

    border-color: #cbd3dc;
}


/* NUMBER */

.player-number {
    width: 52px;
    height: 52px;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            var(--navy),
            var(--navy-deep)
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;
    font-weight: 950;

    letter-spacing: -1px;

    box-shadow:
        0 6px 15px rgba(0,45,98,.18);
}

.player-card.active .player-number {
    background:
        linear-gradient(
            145deg,
            var(--red),
            var(--red-dark)
        );
}


/* MAIN INFO */

.player-main {
    min-width: 0;
}

.player-name {
    color: var(--black);

    font-size: 17px;
    font-weight: 900;

    letter-spacing: -.4px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-position {
    margin-top: 5px;

    color: var(--navy);

    font-size: 10px;
    font-weight: 950;

    letter-spacing: .7px;

    text-transform: uppercase;
}

.player-meta {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    margin-top: 10px;
}

.meta-pill {
    display: inline-flex;
    align-items: center;

    min-height: 23px;

    padding: 0 8px;

    border-radius: 999px;

    background: var(--gray-100);

    color: var(--gray-600);

    font-size: 9px;
    font-weight: 850;
}

.meta-pill.hand {
    background: var(--navy-soft);

    color: var(--navy);
}

.meta-pill.status-active {
    background: var(--red-soft);

    color: var(--red);
}

.meta-pill.status-il {
    background: var(--gold-soft);

    color: #876800;
}


/* STATUS */

.player-status {
    align-self: start;

    margin-top: 2px;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;

    padding: 5px 8px;

    border-radius: 999px;

    background: var(--gray-100);

    color: var(--gray-500);

    font-size: 8px;
    font-weight: 950;

    letter-spacing: .5px;

    text-transform: uppercase;
}

.status-badge::before {
    content: "";

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--gray-400);
}

.status-badge.active {
    background: var(--red-soft);
    color: var(--red);
}

.status-badge.active::before {
    background: var(--red);
}

.status-badge.il {
    background: var(--gold-soft);
    color: #876800;
}

.status-badge.il::before {
    background: var(--gold);
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    padding: 70px 20px;

    background: white;

    border:
        1px solid var(--gray-200);

    border-radius: var(--radius);

    text-align: center;
}

.empty-icon {
    width: 54px;
    height: 54px;

    margin: 0 auto 14px;

    border-radius: 50%;

    background: var(--red-soft);

    color: var(--red);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
}

.empty-title {
    margin: 0;

    color: var(--navy);

    font-size: 16px;
    font-weight: 900;
}

.empty-description {
    margin: 7px 0 0;

    color: var(--gray-500);

    font-size: 11px;
}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 74px;

    display: flex;

    background:
        rgba(255,255,255,.97);

    border-top:
        1px solid var(--gray-200);

    box-shadow:
        0 -6px 25px rgba(0,29,62,.1);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    z-index: 2000;
}

.mobile-nav-item {
    flex: 1;

    border: none;
    background: transparent;

    color: var(--gray-500);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    font-size: 9px;
    font-weight: 850;

    cursor: pointer;

    position: relative;
}

.mobile-nav-item::before {
    content: "";

    position: absolute;

    top: 0;
    left: 25%;
    right: 25%;

    height: 3px;

    border-radius: 0 0 999px 999px;

    background: var(--red);

    transform: scaleX(0);

    transition: transform .2s ease;
}

.mobile-nav-item.active {
    color: var(--navy);
}

.mobile-nav-item.active::before {
    transform: scaleX(1);
}

.mobile-nav-icon {
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .player-grid {
        grid-template-columns: 1fr;
    }

    .filter-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }

    .filter-field:last-child {
        grid-column: 1 / -1;
    }
}


@media (max-width: 700px) {

    .topbar {
        height: 64px;
        border-bottom-width: 3px;
    }

    .topbar-inner {
        padding: 0 14px;
        gap: 0;
    }

    .brand-logo {
        width: 40px;
        height: 40px;
    }

    .brand-name {
        font-size: 18px;
    }

    .brand-label {
        font-size: 7px;
    }

    .desktop-nav {
        display: none;
    }

    .header-icon {
        margin-left: auto;
    }

    .page {
        padding: 25px 13px 40px;
    }

    .page-header {
        align-items: flex-start;
        margin-bottom: 20px;
    }

    .page-title {
        font-size: 31px;
        letter-spacing: -1.5px;
    }

    .page-description {
        font-size: 11px;
        line-height: 1.5;
    }

    .updated-label {
        display: none;
    }

    .filter-panel {
        padding: 16px;
        border-top-width: 3px;
    }

    .filter-grid {
        grid-template-columns: 1fr;
        gap: 11px;
    }

    .filter-field:last-child {
        grid-column: auto;
    }

    .filter-select {
        height: 47px;
    }

    .player-card {
        grid-template-columns:
            56px
            minmax(0,1fr);

        padding:
            15px 14px 15px 18px;
    }

    .player-number {
        width: 47px;
        height: 47px;

        font-size: 18px;
    }

    .player-name {
        font-size: 15px;
    }

    .player-status {
        grid-column: 2;

        margin-top: 10px;
    }
}


@media (max-width: 420px) {

    .page {
        padding-left: 10px;
        padding-right: 10px;
    }

    .page-title {
        font-size: 28px;
    }

    .player-card {
        min-height: 115px;
    }

    .player-meta {
        gap: 4px;
    }

    .meta-pill {
        font-size: 8px;
        padding: 0 7px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="topbar">

    <div class="topbar-inner">

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-logo">

                <img
                    src="phillies-logo.png"
                    alt="Philadelphia Phillies"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='block';
                    "
                >

                <span
                    class="logo-fallback"
                    style="display:none;"
                >
                    P
                </span>

            </div>

            <div class="brand-copy">

                <div class="brand-name">
                    Phillies
                </div>

                <div class="brand-label">
                    Players
                </div>

            </div>

        </a>


        <nav class="desktop-nav">

            <a
                class="nav-item"
                href="index.html"
            >
                News
            </a>

            <a
                class="nav-item"
                href="index.html#games"
            >
                Games
            </a>

            <a
                class="nav-item active"
                href="players.html"
            >
                Players
            </a>

            <a
                class="nav-item"
                href="index.html#more"
            >
                More
            </a>

        </nav>


        <div class="header-spacer"></div>


        <button
            class="header-icon"
            onclick="location.href='index.html'"
            aria-label="Home"
        >
            ⌂
        </button>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="page">


    <section class="page-header">

        <div>

            <div class="page-kicker">

                <span class="kicker-line"></span>

                Philadelphia Phillies

            </div>

            <h1 class="page-title">
                Players
            </h1>

            <p class="page-description">
                Phillies roster, positions and player information.
            </p>

        </div>


        <div
            class="updated-label"
            id="updated-label"
        >
            Loading roster
        </div>

    </section>



    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <section class="filter-panel">

        <div class="filter-heading">

            <div class="filter-title">
                Player Filters
            </div>

            <div
                class="result-count"
                id="result-count"
            >
                0 players
            </div>

        </div>


        <div class="filter-grid">


            <!-- GROUP -->

            <div class="filter-field">

                <label
                    class="filter-label"
                    for="group-filter"
                >
                    Position Group
                </label>

                <div class="select-wrap">

                    <select
                        id="group-filter"
                        class="filter-select"
                    >

                        <option value="all">
                            All Players
                        </option>

                        <option value="pitcher">
                            Pitchers
                        </option>

                        <option value="catcher">
                            Catchers
                        </option>

                        <option value="infielder">
                            Infielders
                        </option>

                        <option value="outfielder">
                            Outfielders
                        </option>

                    </select>

                </div>

            </div>


            <!-- ROSTER -->

            <div class="filter-field">

                <label
                    class="filter-label"
                    for="roster-filter"
                >
                    Roster Status
                </label>

                <div class="select-wrap">

                    <select
                        id="roster-filter"
                        class="filter-select"
                    >

                        <option value="all">
                            All Roster Players
                        </option>

                        <option value="active">
                            Active Only
                        </option>

                        <option value="40man">
                            40-Man Only
                        </option>

                        <option value="il">
                            Injured List
                        </option>

                    </select>

                </div>

            </div>


            <!-- SORT -->

            <div class="filter-field">

                <label
                    class="filter-label"
                    for="sort-filter"
                >
                    Sort
                </label>

                <div class="select-wrap">

                    <select
                        id="sort-filter"
                        class="filter-select"
                    >

                        <option value="number">
                            Jersey Number
                        </option>

                        <option value="name">
                            Player Name
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         PLAYER LIST
    ====================================================== -->

    <section>

        <div class="players-section-header">

            <div class="section-title">
                Phillies Roster
            </div>

        </div>


        <div
            id="player-grid"
            class="player-grid"
        ></div>

    </section>

</main>



<!-- =========================================================
     MOBILE NAV
========================================================= -->

<nav class="mobile-nav">

    <a
        class="mobile-nav-item"
        href="index.html"
    >

        <span class="mobile-nav-icon">
            📰
        </span>

        <span>
            News
        </span>

    </a>


    <a
        class="mobile-nav-item"
        href="index.html#games"
    >

        <span class="mobile-nav-icon">
            ⚾
        </span>

        <span>
            Games
        </span>

    </a>


    <a
        class="mobile-nav-item active"
        href="players.html"
    >

        <span class="mobile-nav-icon">
            👤
        </span>

        <span>
            Players
        </span>

    </a>


    <a
        class="mobile-nav-item"
        href="index.html#more"
    >

        <span class="mobile-nav-icon">
            ⋯
        </span>

        <span>
            More
        </span>

    </a>

</nav>



<script>

/* =========================================================
   STATE
========================================================= */

let players = [];

let currentGroup = "all";
let currentRoster = "all";
let currentSort = "number";


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


function normalizeGroup(player) {

    const group =
        String(player.group || "")
        .toLowerCase();

    if (
        group === "pitcher" ||
        group === "catcher" ||
        group === "infielder" ||
        group === "outfielder"
    ) {
        return group;
    }

    return "infielder";
}


function numericNumber(player) {

    const n =
        parseInt(
            String(player.number ?? "")
                .replace(/\D/g, ""),
            10
        );

    return Number.isFinite(n)
        ? n
        : 999;
}


/* =========================================================
   LOAD
========================================================= */

async function loadPlayers() {

    const container =
        document.getElementById(
            "player-grid"
        );

    container.innerHTML = `
        <div class="empty">
            <div class="empty-icon">⚾</div>
            <h2 class="empty-title">
                Loading Phillies roster
            </h2>
            <p class="empty-description">
                Getting the latest player information.
            </p>
        </div>
    `;


    try {

        const response =
            await fetch(
                "players.json?v=" +
                Date.now()
            );


        if (!response.ok) {
            throw new Error(
                "players.json could not be loaded."
            );
        }


        const data =
            await response.json();


        players =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.players)
                        ? data.players
                        : []
                );


        renderPlayers();


        updateUpdatedLabel(
            data.updatedAt
        );

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    !
                </div>

                <h2 class="empty-title">
                    Roster data unavailable
                </h2>

                <p class="empty-description">
                    players.json could not be loaded.
                    Please run the roster update process.
                </p>

            </div>
        `;

    }

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredPlayers() {

    let result =
        [...players];


    /* GROUP */

    if (
        currentGroup !== "all"
    ) {

        result =
            result.filter(
                player =>
                    normalizeGroup(player)
                    === currentGroup
            );

    }


    /* ROSTER */

    if (
        currentRoster === "active"
    ) {

        result =
            result.filter(
                player =>
                    player.status === "Active"
            );

    }


    if (
        currentRoster === "40man"
    ) {

        result =
            result.filter(
                player =>
                    player.roster40 === true
            );

    }


    if (
        currentRoster === "il"
    ) {

        result =
            result.filter(
                player =>
                    player.status === "IL"
            );

    }


    /* SORT */

    if (
        currentSort === "number"
    ) {

        result.sort(
            (a,b) =>
                numericNumber(a)
                -
                numericNumber(b)
        );

    } else {

        result.sort(
            (a,b) =>
                String(a.name || "")
                    .localeCompare(
                        String(b.name || "")
                    )
        );

    }


    return result;

}


/* =========================================================
   RENDER
========================================================= */

function renderPlayers() {

    const container =
        document.getElementById(
            "player-grid"
        );


    const filtered =
        getFilteredPlayers();


    document.getElementById(
        "result-count"
    ).textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "player"
                : "players"
        }`;


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ⚾
                </div>

                <h2 class="empty-title">
                    No players found
                </h2>

                <p class="empty-description">
                    No players match the selected filters.
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(
                createPlayerCard
            )
            .join("");

}


/* =========================================================
   PLAYER CARD
========================================================= */

function createPlayerCard(player) {

    const status =
        player.status || "40-Man";

    const isActive =
        status === "Active";

    const isIL =
        status === "IL";


    const cardClass =
        isActive
            ? "active"
            : (
                isIL
                    ? "il"
                    : ""
            );


    const number =
        player.number
            ? `#${escapeHtml(player.number)}`
            : "—";


    const position =
        player.position
            || player.groupLabel
            || "—";


    const bats =
        player.bats
            ? `Bats ${escapeHtml(player.bats)}`
            : "";


    const throws =
        player.throws
            ? `Throws ${escapeHtml(player.throws)}`
            : "";


    const statusClass =
        isActive
            ? "active"
            : (
                isIL
                    ? "il"
                    : ""
            );


    return `

        <article
            class="player-card ${cardClass}"
        >

            <div class="player-number">
                ${number}
            </div>


            <div class="player-main">

                <div class="player-name">
                    ${escapeHtml(player.name)}
                </div>


                <div class="player-position">
                    ${escapeHtml(position)}
                </div>


                <div class="player-meta">

                    ${
                        bats
                            ? `
                                <span class="meta-pill hand">
                                    ${bats}
                                </span>
                            `
                            : ""
                    }


                    ${
                        throws
                            ? `
                                <span class="meta-pill hand">
                                    ${throws}
                                </span>
                            `
                            : ""
                    }


                    ${
                        player.roster40
                            ? `
                                <span class="meta-pill">
                                    40-MAN
                                </span>
                            `
                            : ""
                    }

                </div>

            </div>


            <div class="player-status">

                <span
                    class="
                        status-badge
                        ${statusClass}
                    "
                >
                    ${
                        isActive
                            ? "ACTIVE"
                            : (
                                isIL
                                    ? "IL"
                                    : "40-MAN"
                            )
                    }
                </span>

            </div>

        </article>

    `;

}


/* =========================================================
   UPDATED
========================================================= */

function updateUpdatedLabel(value) {

    const label =
        document.getElementById(
            "updated-label"
        );


    if (!value) {

        label.textContent =
            "MLB ROSTER DATA";

        return;

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        label.textContent =
            "MLB ROSTER DATA";

        return;

    }


    label.textContent =
        "Updated " +
        date.toLocaleString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit"
            }
        );

}


/* =========================================================
   EVENTS
========================================================= */

document
    .getElementById("group-filter")
    .addEventListener(
        "change",
        event => {

            currentGroup =
                event.target.value;

            renderPlayers();

        }
    );


document
    .getElementById("roster-filter")
    .addEventListener(
        "change",
        event => {

            currentRoster =
                event.target.value;

            renderPlayers();

        }
    );


document
    .getElementById("sort-filter")
    .addEventListener(
        "change",
        event => {

            currentSort =
                event.target.value;

            renderPlayers();

        }
    );


/* =========================================================
   START
========================================================= */

loadPlayers();

</script>

</body>
</html>
