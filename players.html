<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Phillies Daily — Players</title>

<style>

:root {

    --red: #e31837;
    --red-dark: #c8102e;

    --navy: #002d62;
    --navy-dark: #001b3d;
    --navy-deep: #00152f;

    --white: #ffffff;

    --black: #10151d;

    --gray-900: #252b34;
    --gray-700: #4c5663;
    --gray-600: #687381;
    --gray-500: #89939f;
    --gray-400: #adb5bf;
    --gray-300: #d5dbe2;
    --gray-200: #e4e8ed;
    --gray-100: #f2f4f7;

    --background: #f4f6f9;

    --il: #f2b705;
    --il-soft: #fff7d6;

    --radius: 15px;

    --shadow:
        0 4px 18px rgba(0,29,62,.065);

    --shadow-hover:
        0 12px 32px rgba(0,29,62,.12);
}


* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    background:
        var(--background);

    color:
        var(--black);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

    padding-bottom: 30px;
}


a {
    text-decoration: none;
    color: inherit;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {

    height: 76px;

    background:
        linear-gradient(
            100deg,
            var(--navy-deep),
            var(--navy),
            #003875
        );

    border-bottom:
        4px solid var(--red);

    position: sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 5px 22px
        rgba(0,24,54,.19);
}


.topbar-inner {

    max-width: 1280px;

    height: 100%;

    margin: auto;

    padding: 0 28px;

    display: flex;

    align-items: center;

    gap: 30px;
}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}


.brand-logo {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


.brand-logo img {

    width: 88%;
    height: 88%;

    object-fit: contain;
}


.brand-name {

    color: white;

    font-size: 20px;

    font-weight: 900;
}


.brand-label {

    margin-top: 5px;

    color:
        rgba(255,255,255,.55);

    font-size: 8px;

    font-weight: 800;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}


.desktop-nav {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 3px;
}


.nav-item {

    height: 100%;

    padding: 0 15px;

    border: none;

    background: transparent;

    color:
        rgba(255,255,255,.58);

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    position: relative;
}


.nav-item:hover,
.nav-item.active {

    color: white;
}


.nav-item.active::after {

    content: "";

    position: absolute;

    left: 14px;
    right: 14px;
    bottom: -4px;

    height: 4px;

    background: var(--red);

    border-radius:
        999px 999px 0 0;
}


.header-spacer {
    flex: 1;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    max-width: 1280px;

    margin: auto;

    padding: 40px 28px 65px;
}


.page-kicker {

    display: flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 9px;

    color: var(--red);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}


.page-kicker::before {

    content: "";

    width: 28px;
    height: 4px;

    background: var(--red);

    border-radius: 999px;
}


.page-title {

    margin: 0;

    color: var(--navy-dark);

    font-size: 38px;

    line-height: 1;

    letter-spacing: -1.8px;

    font-weight: 900;
}


.page-description {

    margin: 10px 0 25px;

    color: var(--gray-600);

    font-size: 13px;
}


/* =========================================================
   ROSTER HEADER
========================================================= */

.roster-header {

    background: white;

    border:
        1px solid var(--gray-200);

    border-top:
        4px solid var(--navy);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    padding: 18px 20px;

    margin-bottom: 24px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.roster-source {

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 700;
}


.roster-source strong {

    color: var(--navy);
}


.roster-updated {

    color: var(--gray-500);

    font-size: 10px;
}


/* =========================================================
   POSITION SECTION
========================================================= */

.position-section {

    margin-bottom: 30px;
}


.position-heading {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 11px;
}


.position-title {

    display: flex;

    align-items: center;

    gap: 9px;

    color: var(--navy);

    font-size: 13px;

    font-weight: 900;

    letter-spacing: .8px;

    text-transform: uppercase;
}


.position-title::before {

    content: "";

    width: 5px;

    height: 18px;

    border-radius: 999px;

    background: var(--red);
}


.position-count {

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   PLAYERS
========================================================= */

.player-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;
}


.player-card {

    position: relative;

    background: white;

    border:
        1px solid var(--gray-200);

    border-radius: var(--radius);

    min-height: 78px;

    padding: 14px 16px 14px 74px;

    box-shadow: var(--shadow);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}


.player-card:hover {

    transform:
        translateY(-2px);

    box-shadow:
        var(--shadow-hover);
}


.player-number {

    position: absolute;

    left: 16px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 44px;

    height: 44px;

    border-radius: 12px;

    background: var(--navy);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 17px;

    font-weight: 900;
}


.player-name {

    color: var(--black);

    font-size: 16px;

    font-weight: 850;

    line-height: 1.25;
}


.player-meta {

    margin-top: 5px;

    color: var(--gray-500);

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   STATUS
========================================================= */

.player-status {

    position: absolute;

    right: 13px;

    top: 13px;

    padding: 4px 7px;

    border-radius: 999px;

    font-size: 8px;

    font-weight: 900;

    letter-spacing: .5px;
}


.status-active {

    background:
        #e9f7ee;

    color:
        #218542;
}


.status-40 {

    background:
        #edf3f9;

    color:
        var(--navy);
}


.status-il {

    background:
        var(--il-soft);

    color:
        #9a7300;

    border:
        1px solid
        rgba(242,183,5,.35);
}


.player-card.il {

    border-left:
        5px solid var(--il);
}


.player-card.il
.player-number {

    background:
        var(--il);

    color:
        #332700;
}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.message {

    background: white;

    border:
        1px solid var(--gray-200);

    border-radius: var(--radius);

    padding: 50px 20px;

    text-align: center;

    color: var(--gray-500);

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .topbar {

        height: 64px;
    }


    .topbar-inner {

        padding: 0 14px;
    }


    .desktop-nav {

        display: none;
    }


    .page {

        padding:
            28px 13px 50px;
    }


    .page-title {

        font-size: 30px;
    }


    .roster-header {

        align-items: flex-start;

        flex-direction: column;

        gap: 8px;
    }


    .player-grid {

        grid-template-columns: 1fr;
    }


    .player-card {

        min-height: 74px;
    }


    .player-name {

        font-size: 15px;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="topbar-inner">

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-logo">

                <img
                    src="phillies-logo.png"
                    alt="Philadelphia Phillies"
                >

            </div>

            <div>

                <div class="brand-name">
                    Phillies
                </div>

                <div class="brand-label">
                    Daily News
                </div>

            </div>

        </a>


        <nav class="desktop-nav">

            <a
                href="index.html"
                class="nav-item"
            >
                News
            </a>

            <a
                href="#"
                class="nav-item"
            >
                Games
            </a>

            <a
                href="players.html"
                class="nav-item active"
            >
                Players
            </a>

            <a
                href="#"
                class="nav-item"
            >
                More
            </a>

        </nav>

        <div class="header-spacer"></div>

    </div>

</header>


<main class="page">


    <div class="page-kicker">
        Philadelphia Phillies
    </div>


    <h1 class="page-title">
        Players
    </h1>


    <p class="page-description">
        Phillies roster, 40-man roster and injured list.
    </p>


    <section class="roster-header">

        <div class="roster-source">

            ROSTER SOURCE:
            <strong>MLB</strong>

        </div>


        <div
            class="roster-updated"
            id="roster-updated"
        >
            Updating...
        </div>

    </section>


    <div id="players-container">

        <div class="message">
            Loading roster...
        </div>

    </div>


</main>


<script>

const POSITION_ORDER = [

    "Pitchers",
    "Catchers",
    "Infielders",
    "Outfielders"

];


const POSITION_LABELS = {

    Pitchers:
        "Pitchers",

    Catchers:
        "Catchers",

    Infielders:
        "Infielders",

    Outfielders:
        "Outfielders"

};


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


function statusLabel(status) {

    if (status === "ACTIVE") {
        return "ACTIVE";
    }

    if (status === "IL") {
        return "IL";
    }

    return "40-MAN";
}


function statusClass(status) {

    if (status === "ACTIVE") {
        return "status-active";
    }

    if (status === "IL") {
        return "status-il";
    }

    return "status-40";
}


function renderPlayers(data) {

    const container =
        document.getElementById(
            "players-container"
        );


    container.innerHTML = "";


    if (
        !data ||
        !Array.isArray(data.players)
    ) {

        container.innerHTML = `
            <div class="message">
                Roster data is unavailable.
            </div>
        `;

        return;
    }


    const players =
        data.players;


    POSITION_ORDER.forEach(
        position => {

            const positionPlayers =
                players.filter(
                    player =>
                        player.position === position
                );


            if (
                positionPlayers.length === 0
            ) {
                return;
            }


            const section =
                document.createElement("section");

            section.className =
                "position-section";


            section.innerHTML = `

                <div class="position-heading">

                    <div class="position-title">
                        ${POSITION_LABELS[position]}
                    </div>

                    <div class="position-count">
                        ${positionPlayers.length}
                    </div>

                </div>

                <div class="player-grid"></div>

            `;


            const grid =
                section.querySelector(
                    ".player-grid"
                );


            positionPlayers.forEach(
                player => {

                    const card =
                        document.createElement("article");


                    card.className =
                        "player-card" +
                        (
                            player.status === "IL"
                                ? " il"
                                : ""
                        );


                    const number =
                        player.number ||
                        "—";


                    card.innerHTML = `

                        <div class="player-number">
                            ${escapeHtml(number)}
                        </div>

                        <div class="player-name">
                            ${escapeHtml(player.name)}
                        </div>

                        <div class="player-meta">
                            ${escapeHtml(player.position)}
                        </div>

                        <div
                            class="
                                player-status
                                ${statusClass(player.status)}
                            "
                        >
                            ${statusLabel(player.status)}
                        </div>

                    `;


                    grid.appendChild(card);

                }
            );


            container.appendChild(section);

        }
    );


    const updated =
        document.getElementById(
            "roster-updated"
        );


    if (data.updated_at) {

        const date =
            new Date(data.updated_at);


        updated.textContent =
            "Last updated: " +
            date.toLocaleString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

    }

}


async function loadPlayers() {

    try {

        const response =
            await fetch(
                "players.json?ts=" +
                Date.now()
            );


        if (!response.ok) {
            throw new Error(
                "Roster request failed"
            );
        }


        const data =
            await response.json();


        renderPlayers(data);

    }

    catch(error) {

        console.error(error);


        document.getElementById(
            "players-container"
        ).innerHTML = `

            <div class="message">

                Unable to load the Phillies roster.

            </div>

        `;

    }

}


loadPlayers();

</script>


</body>

</html>
